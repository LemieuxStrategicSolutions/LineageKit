# Optional: weekly research-cycle kickoff as a GitHub Action.
# Install into your PRIVATE research repo at .github/workflows/weekly-cycle.yml.
# It opens a charter issue every Sunday; a human (or an agent session you start)
# fills the charter and closes the loop. The Action itself does no research.
name: Weekly research cycle kickoff
on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch: {}
permissions:
  issues: write
  contents: read
jobs:
  kickoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine next cycle number
        id: cycle
        run: |
          last=$(ls Reports/ 2>/dev/null | grep -oE 'Cycle [0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "next=$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"
      - name: Open charter issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ steps.cycle.outputs.next }}"
          gh issue create \
            --title "Cycle $n charter — draft and approve" \
            --body "$(printf 'Time for the next research cycle.\n\n- [ ] Draft the charter from templates/cycle-charter.template.md\n- [ ] One bounded question per active line; rest the others explicitly\n- [ ] Approve the charter (the human gate)\n- [ ] Run the cycle; log every search including negatives\n- [ ] Write the cycle report with promote/do-not-promote verdicts\n\nProtocol: cycles/README.md in the LineageKit template.')"
